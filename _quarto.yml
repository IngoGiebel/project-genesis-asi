project:
  type: website

website:
  title: "Alpha auriga"
  page-navigation: true
  back-to-top-navigation: true
  open-graph: true
  reader-mode: true
  cookie-consent: true
  search:
    location: navbar
    type: textbox
    show-item-context: true
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - about.qmd

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: sandstone
      dark: cyborg
    css: styles.css
    toc: true
    code-link: true
    code-overflow: wrap
    fig-responsive: true

editor:
  visual: false
