project:
  type: website

bibliography: bibliography.bib
bibliographystyle: american-psychological-association

website:
  title: "Alpha Auriga"
  repo-url: https://github.com/IngoGiebel/project-genesis-asi
  repo-branch: trunk
  repo-actions: [source, edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  open-graph: true
  reader-mode: true
  cookie-consent: true
  search:
    location: navbar
    type: textbox
    show-item-context: true
  navbar:
    pinned: true
    logo: logo.png
    logo-alt: "Alpha Auriga company logo"
    left:
      - text: Home
        href: index.qmd
      - about.qmd

format:
  html:
    respect-user-color-scheme: true
    theme: cyborg
    css: styles.css
    toc: true
    code-link: true
    code-overflow: wrap
    fig-responsive: true

editor:
  visual: false
