<div id="chatbot-container">
  <!-- The main chat window, hidden by default -->
  <div id="chat-window" class="chat-window">
    <div class="chat-header">
      <span class="chat-title">Ihr KI-Assistent</span>
      <button id="close-chat-btn" class="close-chat-btn">&times;</button>
    </div>
    <div id="chat-body" class="chat-body">
      <!-- Chat messages are injected by chatbot.js -->
    </div>
    <div class="chat-footer">
      <form id="chat-form" class="chat-form">
        <textarea
          id="chat-input"
          name="chat-input"
          rows="3"
          maxlength="1000"
          placeholder="Ihre Nachricht..."
          autocomplete="off"
          required
          aria-label="Eingabefeld für Chatnachricht"></textarea>
        <button
          type="submit"
          id="chat-submit-btn"
          title="Frage abschicken">
          <i class="bi bi-rocket-takeoff"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- The floating button that opens the chat -->
  <button id="open-chat-btn" class="open-chat-btn">
    <i class="bi bi-chat-quote-fill"></i>
  </button>
</div>

<script type="module" defer src="chatbot.js"></script>
